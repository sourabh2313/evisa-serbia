<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="60" height="90">
  <!-- Crown Top -->
  <g id="crown">
    <path d="M 30,22 Q 50,15 70,22 L 72,12 L 60,18 L 50,8 L 40,18 L 28,12 Z" fill="#DAA520" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="50" cy="8" r="3" fill="#FFD700"/>
    <circle cx="28" cy="12" r="2" fill="#FFD700"/>
    <circle cx="72" cy="12" r="2" fill="#FFD700"/>
    <path d="M 32,22 Q 50,26 68,22" fill="none" stroke="#B8860B" stroke-width="2"/>
    <circle cx="50" cy="18" r="2" fill="#C6363C"/>
  </g>
  
  <!-- Red Shield Base -->
  <path d="M 20,30 L 80,30 L 80,85 Q 80,120 50,135 Q 20,120 20,85 Z" fill="#C6363C" stroke="#B8860B" stroke-width="2.5"/>
  
  <!-- Golden Border Accent Inside Shield -->
  <path d="M 24,34 L 76,34 L 76,83 Q 76,114 50,128 Q 24,114 24,83 Z" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.7"/>

  <!-- Double-headed White Eagle Wings & Body -->
  <g id="eagle" fill="#FFFFFF">
    <!-- Left Wing -->
    <path d="M 50,60 L 26,42 L 32,55 L 26,62 L 34,70 L 28,78 L 42,82 L 50,75 Z"/>
    <!-- Right Wing -->
    <path d="M 50,60 L 74,42 L 68,55 L 74,62 L 66,70 L 72,78 L 58,82 L 50,75 Z"/>
    <!-- Heads -->
    <path d="M 44,45 Q 40,38 44,35 Q 48,36 49,42 Z"/>
    <path d="M 56,45 Q 60,38 56,35 Q 52,36 51,42 Z"/>
    <!-- Beaks -->
    <path d="M 40,38 L 36,40 L 41,41 Z" fill="#FFD700"/>
    <path d="M 60,38 L 64,40 L 59,41 Z" fill="#FFD700"/>
    <!-- Small Crown over Heads -->
    <path d="M 45,34 L 50,30 L 55,34 Z" fill="#FFD700"/>
  </g>

  <!-- Inner Red Shield on Eagle Chest with Cross and 4 Firesteels -->
  <g id="inner-shield">
    <path d="M 40,65 L 60,65 L 60,92 Q 60,105 50,110 Q 40,105 40,92 Z" fill="#C6363C" stroke="#FFD700" stroke-width="1.2"/>
    <!-- White Cross -->
    <line x1="50" y1="67" x2="50" y2="106" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="42" y1="84" x2="58" y2="84" stroke="#FFFFFF" stroke-width="3"/>
    <!-- 4 C-shaped Firesteels (Ocila) -->
    <path d="M 44,72 C 47,72 47,78 44,78" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M 56,72 C 53,72 53,78 56,78" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M 44,90 C 47,90 47,96 44,96" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M 56,90 C 53,90 53,96 56,96" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
</svg>
